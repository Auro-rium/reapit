[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reapit"
version = "0.1.0"
description = "Generate a beautiful, readable HTML guide from a GitHub repository"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.8.0",
  "rich>=13.7.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "mcp>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.scripts]
reapit = "app.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
